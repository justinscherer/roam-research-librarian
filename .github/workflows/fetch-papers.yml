name: Fetch Papers

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch papers
        run: node scripts/fetch-papers.js
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          ROAM_API_TOKEN: ${{ secrets.ROAM_API_TOKEN }}
          ROAM_GRAPH_NAME: ${{ secrets.ROAM_GRAPH_NAME }}

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen-papers.json data/papers-inbox.md
          git diff --staged --quiet || git commit -m "chore: update seen papers [skip ci]"
          git push
